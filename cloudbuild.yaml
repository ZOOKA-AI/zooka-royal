
steps:
  # 1. Build the container image
  # The image is now tagged for Artifact Registry, Google's recommended container registry.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/zooka-repo/zooka-frontend:$COMMIT_SHA" # Changed for Artifact Registry
      - "."
    waitFor: ['-']

  # 2. Push the container image to Artifact Registry
  # Pushing to Artifact Registry allows for integrated, automated vulnerability scanning.
  # Make sure to enable Container Scanning on the 'zooka-repo' repository in the GCP console.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args: ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/zooka-repo/zooka-frontend:$COMMIT_SHA"] # Changed for Artifact Registry
    waitFor: ['Build']

  # 3. Deploy to Cloud Run
  # The manual 'trivy' vulnerability scan step has been removed. 
  # Best practice is to rely on Artifact Registry's integrated scanning, which can be configured to block deployments based on vulnerability severity.
  # Ensure the Cloud Build service account has 'Artifact Registry Writer' permissions.
  # Ensure the Cloud Run service account has 'Artifact Registry Reader' permissions.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "zooka-frontend",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/zooka-repo/zooka-frontend:$COMMIT_SHA", # Changed for Artifact Registry
        "--region",
        "us-central1",
        "--platform",
        "managed",
        "--no-allow-unauthenticated", # Secure by default, requires IAM authentication
        "--service-account",
        "zooka-frontend-sa@${PROJECT_ID}.iam.gserviceaccount.com",
        "--set-env-vars",
        "SECURITY_LEVEL=MAXIMUM",
        "--memory", "512Mi",
        "--cpu", "1"
      ]
    waitFor: ['Push'] # Now waits for Push directly

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/zooka-repo/zooka-frontend:$COMMIT_SHA" # Changed for Artifact Registry
