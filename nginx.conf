worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance and Security Hardening
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off; # Hide Nginx version from server responses

    # Rate Limiting: Protects against simple DoS attacks
    limit_req_zone $binary_remote_addr zone=global:10m rate=20r/s;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Apply rate limiting to all requests
        limit_req zone=global burst=40 nodelay;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' https://esm.sh 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; object-src 'none';" always;

        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # Deny access to hidden files (e.g., .git, .env)
        location ~ /\. {
            deny all;
        }

        # Long-term caching for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
