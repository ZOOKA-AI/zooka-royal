      class ZookaDefense {
        constructor() {

      // --- ZOOKA THREAT MONITOR ---
      class ThreatMonitor {
        constructor() {
          this.init();
        }

        dispatchThreat(type, details) {
          console.warn(`🚨 ZOOKA THREAT DETECTED: ${type}`, details);
          window.dispatchEvent(new CustomEvent('zooka_threat', { detail: { type, details } }));
        }

        init() {
          this.monitorDOM();
          this.monitorInputs();
        }
        
        monitorDOM() {
            const observer = new MutationObserver(mutations => {
                mutations.forEach(mutation => {
                    if (mutation.type === 'childList') {
                        mutation.addedNodes.forEach(node => {
                            if (node.nodeName === 'SCRIPT' && !(node.src?.includes('esm.sh')) && !node.type?.includes('module')) {
                                self.dispatchThreat('Unauthorized Script Injection', node.src || 'Inline Script');
                                node.remove();
                            }
                        });
                    }
                });
            });
            observer.observe(document.body, { childList: true, subtree: true });
        }

        monitorInputs() {
            document.body.addEventListener('change', event => {
                if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                    if (/<script/i.test(event.target.value)) {
                        this.dispatchThreat('XSS Attempt in Input', event.target.name || event.target.id);
                        event.target.value = ''; // Sanitize
                    }
                }
            }, true);
        }
      }
